<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>3Core Analytics</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('restoAnalytics.theme');
          var dark = t !== 'light';
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}

        // Expand Mini App immediately (before React) so mobile opens near full-screen.
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (!tg) return;
          tg.ready();
          tg.expand();
          // Only call APIs supported by this client version (avoids console errors on v6.0).
          var atLeast = typeof tg.isVersionAtLeast === 'function'
            ? function (v) { try { return tg.isVersionAtLeast(v); } catch (e) { return false; } }
            : function () { return false; };
          if (atLeast('6.1')) {
            try {
              tg.setHeaderColor('#0f172a');
              tg.setBackgroundColor('#0f172a');
            } catch (e2) {}
          }
          // Bot API 8.0+: true device fullscreen when supported.
          if (atLeast('8.0') && typeof tg.requestFullscreen === 'function') {
            try {
              tg.requestFullscreen();
            } catch (e3) {}
          }
        } catch (e4) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
